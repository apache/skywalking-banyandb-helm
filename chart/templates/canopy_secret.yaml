{{/*
Canopy console auth Secret. When the user provides no credentials, the chart
generates a default admin user with a strong random password (24 alphanumeric
chars) and a random session secret. lookup() keeps both stable across
upgrades — the password rotates only when the Secret is deleted.
*/}}
{{- if and .Values.canopy.enabled (not .Values.canopy.auth.existingSecret) }}
{{- $secretName := printf "%s-canopy-auth" (include "banyandb.fullname" .) -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName | default dict -}}
{{- $existingData := get $existing "data" | default dict -}}
{{- $password := .Values.canopy.auth.password | default (get $existingData "password" | b64dec | default (randAlphaNum 24)) -}}
{{- $session := .Values.canopy.auth.sessionSecret | default (get $existingData "session-secret" | b64dec | default (randAlphaNum 48)) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels: {{ include "banyandb.labels" . | nindent 4 }}
    app.kubernetes.io/component: canopy
type: Opaque
stringData:
  # plaintext, read-once via kubectl (see NOTES.txt) — bcrypt form is what
  # canopy actually consumes below.
  password: {{ $password | quote }}
  session-secret: {{ $session | quote }}
  users.yaml: |
    - username: {{ required "canopy.auth.username must be non-empty when the chart generates the default admin (or set canopy.auth.existingSecret)" .Values.canopy.auth.username }}
      passwordHash: {{ $password | bcrypt | quote }}
      role: admin
    {{- range .Values.canopy.auth.users }}
    - username: {{ required "canopy.auth.users[].username is required" .username }}
      passwordHash: {{ required "canopy.auth.users[].passwordHash (bcrypt) is required" .passwordHash | quote }}
      role: {{ .role | default "readonly" }}
    {{- end }}
{{- end }}
