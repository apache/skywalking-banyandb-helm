# Canopy console on a liaison+data BanyanDB cluster: install the chart with
# canopy.enabled and verify the console end-to-end (health, generated default
# admin login, BFF proxy to BanyanDB, SPA, registry read).

setup:
  env: kind
  file: kind.yaml
  init-system-environment: env
  kind:
    expose-ports:
      - namespace: default
        resource: service/banyandb-canopy
        port: 4000
  steps:
    - name: set PATH
      command: export PATH=/tmp/skywalking-infra-e2e/bin:$PATH
    - name: install kubectl
      command: bash test/e2e/setup-e2e-shell/install.sh kubectl
    - name: Install helm
      command: bash test/e2e/setup-e2e-shell/install.sh helm
    - name: Install BanyanDB with the canopy console (cluster)
      command: helm -n default install --wait --timeout 10m banyandb chart/ -f test/e2e/values.canopy-cluster.yaml
      wait:
        - namespace: default
          resource: pod
          for: condition=ready
          label-selector: app.kubernetes.io/component=canopy
    - name: Verify the canopy console
      command: bash test/e2e/verify-canopy.sh banyandb default
  timeout: 15m

verify:
  retry:
    count: 3
    interval: 10s
  cases:
    # The scenario's assertions run in the verify step above (the framework's
    # swctl-based cases target SkyWalking, which this scenario doesn't deploy).
    - query: kubectl -n default get deploy banyandb-canopy -o yaml
      expected: expected/canopy-deployment.yml
