# Canopy console on a STANDALONE BanyanDB: install the chart with
# canopy.enabled and verify the console end-to-end (health, generated default
# admin login, BFF proxy to BanyanDB, SPA, registry read).

setup:
  env: kind
  file: kind.yaml
  init-system-environment: env
  kind:
    expose-ports:
      - namespace: default
        resource: service/banyandb-canopy
        port: 4000
  steps:
    - name: set PATH
      command: export PATH=/tmp/skywalking-infra-e2e/bin:$PATH
    - name: install kubectl
      command: bash test/e2e/setup-e2e-shell/install.sh kubectl
    - name: Install helm
      command: bash test/e2e/setup-e2e-shell/install.sh helm
    - name: Install BanyanDB with the canopy console (standalone)
      command: helm -n default install --wait --timeout 20m banyandb chart/ -f test/e2e/values.canopy.yaml
      wait:
        - namespace: default
          resource: pod
          for: condition=ready
          label-selector: app.kubernetes.io/component=canopy
    - name: Verify the canopy console
      command: bash test/e2e/verify-canopy.sh banyandb default
  timeout: 25m

# The framework's swctl-based verify cases target a SkyWalking deployment,
# which this scenario does not install — the gate is the verify-canopy.sh
# step above (health, generated-admin login, BFF proxy, SPA, registry read).
