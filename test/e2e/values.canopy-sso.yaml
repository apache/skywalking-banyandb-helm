# Overlay values.canopy.yaml. All credentials here are test-only.
canopy:
  image:
    tag: "874367dc8c8e218d36c404ecbde91818e0922847-canopy"
  envFromSecret: canopy-sso-credentials
  auth:
    config:
      auth:
        backend: sso
        sso:
          timeoutMs: 1000
          providers:
            - id: github
              name: Mock GitHub
              type: oauth2
              clientId: canopy-e2e
              clientSecretEnv: CANOPY_AUTH_SSO_GITHUB_CLIENT_SECRET
              authorizeUrl: http://canopy-sso-idp:8080/authorize
              tokenUrl: http://canopy-sso-idp:8080/token
              userinfoUrl: http://canopy-sso-idp:8080/userinfo
              emailsUrl: http://canopy-sso-idp:8080/emails
              scopes: [read:user, user:email]
            - id: google
              name: Mock Google
              type: oidc
              issuer: http://canopy-sso-idp:8080
              clientId: canopy-e2e
              clientSecretEnv: CANOPY_AUTH_SSO_GOOGLE_CLIENT_SECRET
              scopes: [openid, email]
          roles:
            defaultRoles: [readonly]
            roleByEmail:
              admin@example.test: [admin]
        breakGlass:
          enabled: true
          users:
            - username: emergency
              role: admin
              passwordHash: '$argon2id$v=19$m=19456,t=2,p=1$ZTJlLXN0YXRpYy1zYWx0LW9ubHk$4Nacc3XrCGd4na6NE9yiR3hHz18SMxq+0TjGll1GxkQ'
