# Standalone BanyanDB + canopy console for the canopy e2e scenario.
# canopy.image.tag must point at a sha whose "<sha>-canopy" image is published
# (pushed by the Canopy workflow on main).
cluster:
  enabled: false

image:
  repository: ghcr.io/apache/skywalking-banyandb
  tag: 32055eb1a069a8c6ab93b5e7de5bb72e7bf7dec0
  pullPolicy: IfNotPresent

standalone:
  enabled: true
  name: banyandb
  httpSvc:
    type: ClusterIP

canopy:
  enabled: true
  image:
    tag: "36921708b3bd3e0cd0ca37db9761fadf685c99a1-canopy"
  service:
    type: ClusterIP
