# Successful OAuth2 and OIDC logins with deterministic local identity providers.
setup:
  env: kind
  file: kind.yaml
  init-system-environment: env
  steps:
    - name: set PATH
      command: export PATH=/tmp/skywalking-infra-e2e/bin:$PATH
    - name: install kubectl
      command: bash test/e2e/setup-e2e-shell/install.sh kubectl
    - name: Install helm
      command: bash test/e2e/setup-e2e-shell/install.sh helm
    - name: Install test identity provider and credentials
      command: bash test/e2e/setup-canopy-sso.sh default
    - name: Install Canopy SSO
      command: helm -n default install --wait --timeout 20m banyandb chart/ -f test/e2e/values.canopy.yaml -f test/e2e/values.canopy-sso.yaml
    - name: Verify Canopy SSO and break-glass
      command: bash test/e2e/verify-canopy-sso.sh banyandb default
    - name: Verify local authentication compatibility
      command: bash test/e2e/verify-canopy-local-compatibility.sh banyandb default
  timeout: 30m
