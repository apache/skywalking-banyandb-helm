# E2E values for testing trace-pipeline sampler plugin deployment.

image:
  repository: ghcr.io/apache/skywalking-banyandb
  tag: 38932b9113686cddb75739adf2ed2e75324a927a
  pullPolicy: IfNotPresent

cluster:
  enabled: true
  nodeDiscovery:
    mode: "dns"
  liaison:
    replicas: 1
    securityContext:
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
    containerSecurityContext:
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      runAsNonRoot: true
      capabilities:
        drop: ["ALL"]
    volumePermissions:
      enabled: true
      chownUser: 1000
      chownGroup: 1000
      image: busybox:1.36
    podDisruptionBudget: {}
    updateStrategy:
      type: RollingUpdate
    podManagementPolicy: Parallel
    resources:
      requests: []
      limits: []
    grpcSvc:
      port: 17912
    httpSvc:
      port: 17913
      type: LoadBalancer
    livenessProbe:
      initialDelaySeconds: 20
      periodSeconds: 5
      timeoutSeconds: 5
      successThreshold: 1
      failureThreshold: 60
    readinessProbe:
      initialDelaySeconds: 20
      periodSeconds: 5
      timeoutSeconds: 5
      successThreshold: 1
      failureThreshold: 60
    startupProbe:
      initialDelaySeconds: 0
      periodSeconds: 5
      timeoutSeconds: 5
      successThreshold: 1
      failureThreshold: 60

  data:
    nodeTemplate:
      replicas: 1
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containerSecurityContext:
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        capabilities:
          drop: ["ALL"]
      volumePermissions:
        enabled: true
        chownUser: 1000
        chownGroup: 1000
        image: busybox:1.36
      podDisruptionBudget: {}
      resources:
        requests: []
        limits: []
      backupSidecar:
        enabled: false
      restoreInitContainer:
        enabled: false
      livenessProbe:
        initialDelaySeconds: 20
        periodSeconds: 5
        timeoutSeconds: 5
        successThreshold: 1
        failureThreshold: 60
      readinessProbe:
        initialDelaySeconds: 20
        periodSeconds: 5
        timeoutSeconds: 5
        successThreshold: 1
        failureThreshold: 60
      startupProbe:
        initialDelaySeconds: 0
        periodSeconds: 5
        timeoutSeconds: 5
        successThreshold: 1
        failureThreshold: 60
    roles:
      hot: {}

  ui:
    type: None

  fodc:
    enabled: false

plugins:
  enabled: true
  mountMode: initContainer
