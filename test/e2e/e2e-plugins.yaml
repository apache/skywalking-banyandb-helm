# E2E test for trace-pipeline sampler plugin deployment.

setup:
  env: kind
  file: kind.yaml
  init-system-environment: env
  steps:
    - name: set PATH
      command: export PATH=/tmp/skywalking-infra-e2e/bin:$PATH
    - name: install yq
      command: bash test/e2e/setup-e2e-shell/install.sh yq
    - name: install kubectl
      command: bash test/e2e/setup-e2e-shell/install.sh kubectl
    - name: Install helm
      command: bash test/e2e/setup-e2e-shell/install.sh helm
    - name: Create test namespace
      command: kubectl create namespace istio-system
    - name: Install BanyanDB with plugins
      command: helm -n istio-system install --wait --timeout 20m banyandb chart/ -f test/e2e/values.plugins.yaml
      wait:
        - namespace: istio-system
          resource: pod
          for: condition=ready
          label-selector: app.kubernetes.io/name=banyandb
    - name: Verify data node uses plugin host image
      command: |
        kubectl -n istio-system get pod -l app.kubernetes.io/name=banyandb,app.kubernetes.io/component=data -o jsonpath='{.items[0].spec.containers[?(@.name=="data")].image}' | grep -q -- '-plugins$'
    - name: Verify plugin args are present
      command: |
        kubectl -n istio-system get pod -l app.kubernetes.io/name=banyandb,app.kubernetes.io/component=data -o jsonpath='{.items[0].spec.containers[?(@.name=="data")].args}' | grep -q 'trace-pipeline-native-plugin-enabled'
    - name: Create metrics service and verify plugin loads
      command: kubectl -n istio-system apply -f test/e2e/plugin-verify-job.yaml
      wait:
        - namespace: istio-system
          resource: job/banyandb-plugin-verify
          for: condition=complete
  timeout: 25m

verify:
  retry:
    count: 5
    interval: 5s
  cases:
    - query: kubectl -n istio-system logs job/banyandb-plugin-verify
      expected: expected/plugin-sampler-active.yml
