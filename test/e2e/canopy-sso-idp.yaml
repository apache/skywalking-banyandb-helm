# Test credentials and mock IdP: isolated test clusters only.
apiVersion: v1
kind: Secret
metadata:
  name: canopy-sso-credentials
stringData:
  CANOPY_AUTH_SSO_GITHUB_CLIENT_SECRET: e2e-provider-secret
  CANOPY_AUTH_SSO_GOOGLE_CLIENT_SECRET: e2e-provider-secret
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: canopy-sso-idp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: canopy-sso-idp
  template:
    metadata:
      labels:
        app: canopy-sso-idp
    spec:
      containers:
        - name: idp
          image: ghcr.io/apache/skywalking-banyandb:874367dc8c8e218d36c404ecbde91818e0922847-canopy
          command: [/nodejs/bin/node, /fixture/idp.cjs]
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /.well-known/openid-configuration
              port: 8080
          volumeMounts:
            - name: fixture
              mountPath: /fixture
      volumes:
        - name: fixture
          configMap:
            name: canopy-sso-idp
---
apiVersion: v1
kind: Service
metadata:
  name: canopy-sso-idp
spec:
  selector:
    app: canopy-sso-idp
  ports:
    - port: 8080
      targetPort: 8080
