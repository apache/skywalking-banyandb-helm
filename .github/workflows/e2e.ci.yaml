name: Test

on:
  pull_request:
  push:
    paths-ignore:
      - '**.md'
    branches:
      - master

env:
  SKIP_TEST: true
  ISTIO_VERSION: 1.24.0

jobs:
  als:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        test:
          - name: Run Skywalking E2E Test (standalone BanyanDB as database)
            config: test/e2e/e2e-standalone.yaml
          - name: Run Skywalking E2E Test (BanyanDB cluster as database)
            config: test/e2e/e2e-cluster.yaml
          - name: Run Skywalking E2E Test (BanyanDB lifecycle as database)
            config: test/e2e/e2e-lifecycle.yaml
          - name: Run Skywalking E2E Test (FODC Proxy Service)
            config: test/e2e/e2e-fodc-proxy-service.yaml
          - name: Run Skywalking E2E Test (BanyanDB DNS cluster state)
            config: test/e2e/e2e-dns-cluster-state.yaml
          - name: Run Canopy E2E Test (standalone BanyanDB + canopy console)
            config: test/e2e/e2e-canopy-standalone.yaml
          - name: Run Canopy E2E Test (BanyanDB cluster + canopy console)
            config: test/e2e/e2e-canopy-cluster.yaml
          - name: Run Skywalking E2E Test (BanyanDB trace-pipeline plugins)
            config: test/e2e/e2e-plugins.yaml
    name: ${{ matrix.test.name }}
    env:
      OAP_TAG: 65137fc27fd765bb44007bad7fcbe59a185fa617
      OAP_REPO: ghcr.io/apache/skywalking/oap
      UI_TAG: 65137fc27fd765bb44007bad7fcbe59a185fa617
      UI_REPO: ghcr.io/apache/skywalking/ui
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Login to ghcr
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Clone skywalking-infra-e2e
        run: |
          git clone https://github.com/apache/skywalking-infra-e2e.git skywalking-infra-e2e-src
          git -C skywalking-infra-e2e-src checkout 7e4b5b68716fdb7b79b21fa8908f9db497e1b115
      - name: Setup go
        uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version: '1.24'
      - name: Install docker-compose
        shell: bash
        run: |
          if ! command -v docker-compose >/dev/null 2>&1; then
            echo "Installing docker-compose"
            sudo curl -L "https://github.com/docker/compose/releases/download/1.29.2/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
            sudo chmod +x /usr/local/bin/docker-compose
          fi
      - name: Install skywalking-infra-e2e
        run: make -C skywalking-infra-e2e-src install DESTDIR=/usr/local/bin
      - name: ${{ matrix.test.name }}
        run: |
          export SW_INFRA_E2E_LOG_DIR="${{ runner.temp }}/skywalking-infra-e2e/logs"
          e2e run \
            -c "$GITHUB_WORKSPACE/${{ matrix.test.config }}" \
            -B \
            -w "${{ runner.temp }}/skywalking-infra-e2e" \
            -l "$SW_INFRA_E2E_LOG_DIR"
      - if: ${{ failure() }}
        run: |
          df -h
          du -sh .
          for dir in $(find . -type d -not -name '.*'); do
            du -sh $dir
          done
          docker images
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ failure() }}
        name: Upload Logs
        with:
          name: logs-${{ github.run_id }}-${{ strategy.job-index }}
          path: "${{ runner.temp }}/skywalking-infra-e2e/logs"


  build:
    runs-on: ubuntu-latest
    needs: [als]
    steps:
      - name: dummy
        run: echo
